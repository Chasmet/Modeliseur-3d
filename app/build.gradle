import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest

plugins {
    id 'com.android.application'
}

def depthModelFile = file(
        'src/main/assets/models/depth_anything_v2_small_fp32.onnx'
)
def depthModelTemporary = file(
        'src/main/assets/models/depth_anything_v2_small_fp32.onnx.part'
)
def depthModelUrl =
        'https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/onnx/model.onnx?download=true'
def depthModelSha256 =
        'afb6a5c28f3b6bf1618c6e43f02073ef9dfdc70e937502d51603e57b0a1df10c'

def segmentationModelFile = file(
        'src/main/assets/models/isnet_anime.onnx'
)
def segmentationModelTemporary = file(
        'src/main/assets/models/isnet_anime.onnx.part'
)
def segmentationModelUrl =
        'https://github.com/danielgatis/rembg/releases/download/v0.0.0/isnet-anime.onnx'
def segmentationModelMd5 = '6f184e756bb3bd901c8849220a83e38e'

def fileDigest = { File target, String algorithm ->
    MessageDigest digest = MessageDigest.getInstance(algorithm)
    target.withInputStream { input ->
        byte[] buffer = new byte[1024 * 1024]
        int read
        while ((read = input.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect {
        String.format('%02x', ((int) it) & 0xFF)
    }.join()
}

tasks.register('downloadDepthModel') {
    group = 'machine learning'
    description = 'Télécharge Depth Anything V2 Small pour le relief local.'
    outputs.file(depthModelFile)

    doLast {
        if (depthModelFile.isFile()
                && fileDigest(depthModelFile, 'SHA-256') == depthModelSha256) {
            println 'Depth Anything V2 déjà présent et vérifié.'
            return
        }

        depthModelFile.parentFile.mkdirs()
        depthModelTemporary.delete()
        println 'Téléchargement de Depth Anything V2 Small FP32…'
        ant.get(
                src: depthModelUrl,
                dest: depthModelTemporary,
                verbose: true,
                skipexisting: false
        )

        String downloaded = fileDigest(depthModelTemporary, 'SHA-256')
        if (downloaded != depthModelSha256) {
            depthModelTemporary.delete()
            throw new GradleException(
                    'Depth Anything V2 est incomplet ou corrompu. SHA-256 : '
                            + downloaded
            )
        }
        Files.move(
                depthModelTemporary.toPath(),
                depthModelFile.toPath(),
                StandardCopyOption.REPLACE_EXISTING
        )
        println 'Depth Anything V2 vérifié : ' + depthModelFile.length() + ' octets.'
    }
}

tasks.register('downloadAnimeSegmentationModel') {
    group = 'machine learning'
    description = 'Télécharge IS-Net Anime pour détourer précisément les personnages.'
    outputs.file(segmentationModelFile)

    doLast {
        if (segmentationModelFile.isFile()
                && fileDigest(segmentationModelFile, 'MD5') == segmentationModelMd5) {
            println 'IS-Net Anime déjà présent et vérifié.'
            return
        }

        segmentationModelFile.parentFile.mkdirs()
        segmentationModelTemporary.delete()
        println 'Téléchargement du réseau IS-Net Anime…'
        ant.get(
                src: segmentationModelUrl,
                dest: segmentationModelTemporary,
                verbose: true,
                skipexisting: false
        )

        String downloaded = fileDigest(segmentationModelTemporary, 'MD5')
        if (downloaded != segmentationModelMd5) {
            segmentationModelTemporary.delete()
            throw new GradleException(
                    'IS-Net Anime est incomplet ou corrompu. MD5 : ' + downloaded
            )
        }
        Files.move(
                segmentationModelTemporary.toPath(),
                segmentationModelFile.toPath(),
                StandardCopyOption.REPLACE_EXISTING
        )
        println 'IS-Net Anime vérifié : '
                + segmentationModelFile.length() + ' octets.'
    }
}

android {
    namespace 'com.chasmet.modeliseur3d'
    compileSdk 34

    defaultConfig {
        applicationId 'com.chasmet.modeliseur3d'
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName '4.1.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['onnx']
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('downloadDepthModel')
    dependsOn tasks.named('downloadAnimeSegmentationModel')
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
}
