import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest

plugins {
    id 'com.android.application'
}

def segmentationModelFile = file(
        'src/main/assets/models/isnet_anime_fp32.onnx'
)
def segmentationModelTemporary = file(
        'src/main/assets/models/isnet_anime_fp32.onnx.part'
)
def segmentationModelUrl =
        'https://huggingface.co/onnx-community/anime-seg-ONNX/resolve/25f233dc9f60e116dc79a5ba7e9575585388a36f/onnx/model.onnx?download=true'
def segmentationModelSha256 =
        '6a92a19a47e8197fb6dbcf85be14600806019831fedfe7f86eeeeffd4c40dbba'
def ciDebugKeystorePath = System.getenv('MODELISEUR_DEBUG_KEYSTORE')
def hasCiDebugKeystore = ciDebugKeystorePath != null
        && !ciDebugKeystorePath.trim().isEmpty()

def fileDigest = { File target, String algorithm ->
    MessageDigest digest = MessageDigest.getInstance(algorithm)
    target.withInputStream { input ->
        byte[] buffer = new byte[1024 * 1024]
        int read
        while ((read = input.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect {
        String.format('%02x', ((int) it) & 0xFF)
    }.join()
}

tasks.register('downloadAnimeSegmentationModel') {
    group = 'machine learning'
    description = 'Télécharge IS-Net Anime FP32 pour le détourage 2.5D et la reconstruction 3D locale.'
    outputs.file(segmentationModelFile)

    doLast {
        if (segmentationModelFile.isFile()
                && fileDigest(segmentationModelFile, 'SHA-256') == segmentationModelSha256) {
            println 'IS-Net Anime FP32 déjà présent et vérifié.'
            return
        }

        segmentationModelFile.parentFile.mkdirs()
        segmentationModelTemporary.delete()
        println 'Téléchargement du réseau IS-Net Anime FP32 mobile…'
        ant.get(
                src: segmentationModelUrl,
                dest: segmentationModelTemporary,
                verbose: true,
                skipexisting: false
        )

        String downloaded = fileDigest(segmentationModelTemporary, 'SHA-256')
        if (downloaded != segmentationModelSha256) {
            segmentationModelTemporary.delete()
            throw new GradleException(
                    'IS-Net Anime FP32 est incomplet ou corrompu. SHA-256 : '
                            + downloaded
            )
        }
        Files.move(
                segmentationModelTemporary.toPath(),
                segmentationModelFile.toPath(),
                StandardCopyOption.REPLACE_EXISTING
        )
        println 'IS-Net Anime FP32 vérifié : '
                + segmentationModelFile.length() + ' octets.'
    }
}

android {
    namespace 'com.chasmet.modeliseur3d'
    compileSdk 34

    signingConfigs {
        if (hasCiDebugKeystore) {
            ciDebug {
                storeFile file(ciDebugKeystorePath)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    defaultConfig {
        applicationId 'com.chasmet.modeliseur3d'
        minSdk 21
        targetSdk 34
        versionCode 49
        versionName '6.3.3'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            if (hasCiDebugKeystore) {
                signingConfig signingConfigs.ciDebug
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['onnx']
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

def viewerNpm = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'
tasks.register('installMobileViewer', Exec) {
    workingDir rootProject.projectDir
    commandLine viewerNpm, 'ci', '--prefix', 'tools/viewer', '--ignore-scripts'
    inputs.files(rootProject.file('tools/viewer/package.json'), rootProject.file('tools/viewer/package-lock.json'))
    outputs.dir(rootProject.file('tools/viewer/node_modules'))
}
tasks.register('buildMobileViewer', Exec) {
    dependsOn tasks.named('installMobileViewer')
    workingDir rootProject.projectDir
    commandLine viewerNpm, 'run', 'build', '--prefix', 'tools/viewer'
    inputs.file(rootProject.file('tools/viewer/viewer.js'))
    outputs.file(file('src/main/assets/viewer/viewer.js'))
}
tasks.register('downloadOfflineDepthModel', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/offline-models/fetch_depth.py'
    outputs.file(file('src/main/assets/models/depth_anything_v2_small_fp32.onnx'))
    // Also verify cached bytes each build; no model URL is referenced by Android code.
    outputs.upToDateWhen { false }
}
tasks.register('downloadOfflineTripoSRModels', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/offline-models/fetch_triposr.py'
    outputs.files(file('src/main/assets/models/triposr_encoder_int4.onnx'),file('src/main/assets/models/triposr_encoder_int4.onnx.data'),file('src/main/assets/models/triposr_decoder.onnx'),file('src/main/assets/models/triposr_decoder.onnx.data'))
    outputs.upToDateWhen { false }
}
tasks.named('preBuild').configure {
    dependsOn tasks.named('downloadOfflineTripoSRModels')
    dependsOn tasks.named('buildMobileViewer')
    dependsOn tasks.named('downloadAnimeSegmentationModel')
    dependsOn tasks.named('downloadOfflineDepthModel')
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.work:work-runtime:2.9.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
}

// Optional desktop integration checks; no test runtime or fixture enters the APK.
if (providers.gradleProperty('offlineSmoke').isPresent()) {
    android {
        sourceSets.test.java.srcDir(rootProject.file('tools/android-smoke'))
        testOptions {
            unitTests.includeAndroidResources = true
            unitTests.all { maxHeapSize = '3g'; maxParallelForks = 1 }
        }
    }
    dependencies {
        testImplementation 'org.robolectric:robolectric:4.14.1'
        testRuntimeOnly 'com.microsoft.onnxruntime:onnxruntime:1.20.0'
    }
}
