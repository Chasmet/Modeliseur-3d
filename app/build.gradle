import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest

plugins {
    id 'com.android.application'
}

def neuralModelFile = file(
        'src/main/assets/models/depth_anything_v2_small_fp32.onnx'
)
def neuralModelTemporary = file(
        'src/main/assets/models/depth_anything_v2_small_fp32.onnx.part'
)
def neuralModelUrl =
        'https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/onnx/model.onnx?download=true'
def neuralModelSha256 =
        'afb6a5c28f3b6bf1618c6e43f02073ef9dfdc70e937502d51603e57b0a1df10c'

def fileSha256 = { File target ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    target.withInputStream { input ->
        byte[] buffer = new byte[1024 * 1024]
        int read
        while ((read = input.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect {
        String.format('%02x', ((int) it) & 0xFF)
    }.join()
}

tasks.register('downloadNeuralModel') {
    group = 'machine learning'
    description = 'Télécharge le modèle libre Depth Anything V2 Small dans l’APK.'
    outputs.file(neuralModelFile)

    doLast {
        if (neuralModelFile.isFile()
                && fileSha256(neuralModelFile) == neuralModelSha256) {
            println 'Modèle neuronal V4 déjà présent et vérifié.'
            return
        }

        neuralModelFile.parentFile.mkdirs()
        neuralModelTemporary.delete()
        println 'Téléchargement du moteur neuronal Depth Anything V2 Small FP32…'
        ant.get(
                src: neuralModelUrl,
                dest: neuralModelTemporary,
                verbose: true,
                skipexisting: false
        )

        String downloadedSha256 = fileSha256(neuralModelTemporary)
        if (downloadedSha256 != neuralModelSha256) {
            neuralModelTemporary.delete()
            throw new GradleException(
                    'Le modèle neuronal téléchargé est incomplet ou corrompu. '
                            + 'SHA-256 reçu : ' + downloadedSha256
            )
        }

        Files.move(
                neuralModelTemporary.toPath(),
                neuralModelFile.toPath(),
                StandardCopyOption.REPLACE_EXISTING
        )
        println 'Modèle neuronal V4 vérifié : ' + neuralModelFile.length() + ' octets.'
    }
}

android {
    namespace 'com.chasmet.modeliseur3d'
    compileSdk 34

    defaultConfig {
        applicationId 'com.chasmet.modeliseur3d'
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName '4.0.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            // La V4 cible les téléphones Android modernes 64 bits afin de limiter
            // la taille des bibliothèques natives ONNX Runtime dans l'APK.
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        // Le modèle est copié directement vers le stockage privé du téléphone.
        noCompress += ['onnx']
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('downloadNeuralModel')
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'

    // Version officielle publiée sur Maven Central et compatible avec minSdk 21.
    // Elle inclut NNAPI, XNNPACK et le runtime Java complet.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
}
