import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest

plugins {
    id 'com.android.application'
}

def segmentationModelFile = file(
        'src/main/assets/models/isnet_anime_fp32.onnx'
)
def segmentationModelTemporary = file(
        'src/main/assets/models/isnet_anime_fp32.onnx.part'
)
def segmentationModelUrl =
        'https://huggingface.co/onnx-community/anime-seg-ONNX/resolve/25f233dc9f60e116dc79a5ba7e9575585388a36f/onnx/model.onnx?download=true'
def segmentationModelSha256 =
        '6a92a19a47e8197fb6dbcf85be14600806019831fedfe7f86eeeeffd4c40dbba'
def ciDebugKeystorePath = System.getenv('MODELISEUR_DEBUG_KEYSTORE')
def hasCiDebugKeystore = ciDebugKeystorePath != null
        && !ciDebugKeystorePath.trim().isEmpty()

def fileDigest = { File target, String algorithm ->
    MessageDigest digest = MessageDigest.getInstance(algorithm)
    target.withInputStream { input ->
        byte[] buffer = new byte[1024 * 1024]
        int read
        while ((read = input.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect {
        String.format('%02x', ((int) it) & 0xFF)
    }.join()
}

tasks.register('downloadAnimeSegmentationModel') {
    group = 'machine learning'
    description = 'Télécharge IS-Net Anime FP32 pour le détourage 2.5D et 3D local.'
    outputs.file(segmentationModelFile)

    doLast {
        if (segmentationModelFile.isFile()
                && fileDigest(segmentationModelFile, 'SHA-256') == segmentationModelSha256) {
            println 'IS-Net Anime FP32 déjà présent et vérifié.'
            return
        }

        segmentationModelFile.parentFile.mkdirs()
        segmentationModelTemporary.delete()
        println 'Téléchargement du réseau IS-Net Anime FP32 mobile…'
        ant.get(
                src: segmentationModelUrl,
                dest: segmentationModelTemporary,
                verbose: true,
                skipexisting: false
        )

        String downloaded = fileDigest(segmentationModelTemporary, 'SHA-256')
        if (downloaded != segmentationModelSha256) {
            segmentationModelTemporary.delete()
            throw new GradleException(
                    'IS-Net Anime FP32 est incomplet ou corrompu. SHA-256 : '
                            + downloaded
            )
        }
        Files.move(
                segmentationModelTemporary.toPath(),
                segmentationModelFile.toPath(),
                StandardCopyOption.REPLACE_EXISTING
        )
        println 'IS-Net Anime FP32 vérifié : '
                + segmentationModelFile.length() + ' octets.'
    }
}

android {
    namespace 'com.chasmet.modeliseur3d'
    compileSdk 34

    signingConfigs {
        if (hasCiDebugKeystore) {
            ciDebug {
                storeFile file(ciDebugKeystorePath)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    defaultConfig {
        applicationId 'com.chasmet.modeliseur3d'
        minSdk 21
        targetSdk 34
        versionCode 20
        versionName '5.3.1'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            if (hasCiDebugKeystore) {
                signingConfig signingConfigs.ciDebug
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['onnx']
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('downloadAnimeSegmentationModel')
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
}
