name: Test TripoSR 6.6.4 — maillage adaptatif
on:
  push:
    branches:
      - agent/tripo-adaptive-quality-v6.6.4
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: SDK Android 34
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          chmod +x gradlew
      - name: Compilation Java et tests TripoSR hors ligne
        run: |
          ./gradlew --no-daemon -PtripoSourceCheckOnly :app:testDebugUnitTest \
            --tests com.chasmet.modeliseur3d.model.TripoAdaptiveQualityTest \
            --tests com.chasmet.modeliseur3d.model.TripoQualityToolsTest
      - name: Rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-triposr-664
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
