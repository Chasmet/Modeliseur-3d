name: Publier V9.1 APK complet

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Télécharger part0
        uses: actions/download-artifact@v4
        with:
          name: Modeliseur-V9-1-Risk-part0
          path: /tmp/p0
          repository: Chasmet/Modeliseur-3d
          run-id: 31732787397
          github-token: ${{ github.token }}

      - name: Télécharger part1
        uses: actions/download-artifact@v4
        with:
          name: Modeliseur-V9-1-Risk-part1
          path: /tmp/p1
          repository: Chasmet/Modeliseur-3d
          run-id: 31732787397
          github-token: ${{ github.token }}

      - name: Télécharger part2
        uses: actions/download-artifact@v4
        with:
          name: Modeliseur-V9-1-Risk-part2
          path: /tmp/p2
          repository: Chasmet/Modeliseur-3d
          run-id: 31732787397
          github-token: ${{ github.token }}

      - name: Télécharger part3 et contrôles
        uses: actions/download-artifact@v4
        with:
          name: Modeliseur-V9-1-Risk-part3
          path: /tmp/p3
          repository: Chasmet/Modeliseur-3d
          run-id: 31732787397
          github-token: ${{ github.token }}

      - name: Reconstituer APK exact
        shell: bash
        run: |
          set -euo pipefail
          find /tmp/p0 /tmp/p1 /tmp/p2 /tmp/p3 -maxdepth 2 -type f -ls
          P0=$(find /tmp/p0 -type f -name '*.part0' | head -1)
          P1=$(find /tmp/p1 -type f -name '*.part1' | head -1)
          P2=$(find /tmp/p2 -type f -name '*.part2' | head -1)
          P3=$(find /tmp/p3 -type f -name '*.part3' | head -1)
          cat "$P0" "$P1" "$P2" "$P3" > Modeliseur-3D-V9.1-Risk-SAM-XL0-DA3-392.apk
          test "$(stat -c%s Modeliseur-3D-V9.1-Risk-SAM-XL0-DA3-392.apk)" = "936057609"
          echo "9f9d2b3c40b000ddadd5d632259ab0e3ffee2390cf48ff8072961b5329b5fe81  Modeliseur-3D-V9.1-Risk-SAM-XL0-DA3-392.apk" | sha256sum -c -

      - name: Créer la Release V9.1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v9.1-risk --repo Chasmet/Modeliseur-3d >/dev/null 2>&1; then
            echo "Release déjà créée"
          else
            gh release create v9.1-risk \
              --repo Chasmet/Modeliseur-3d \
              --target 6d0f632aa67e4c70fb093dea941d8a3ad81cb306 \
              --title "Modeliseur 3D V9.1 Risk — SAM XL0 + DA3 392" \
              --notes "APK Android complet V9.1. EfficientViT-SAM XL0 1024, DA3 quatre vues 392, grille 3D dense et raffineur quadrupède. APK vérifié : 936057609 octets. SHA-256 : 9f9d2b3c40b000ddadd5d632259ab0e3ffee2390cf48ff8072961b5329b5fe81" \
              --prerelease
          fi

      - name: Envoyer APK complet dans la Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload v9.1-risk \
            Modeliseur-3D-V9.1-Risk-SAM-XL0-DA3-392.apk \
            --repo Chasmet/Modeliseur-3d \
            --clobber

      - name: Vérifier la Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view v9.1-risk --repo Chasmet/Modeliseur-3d --json url,assets
