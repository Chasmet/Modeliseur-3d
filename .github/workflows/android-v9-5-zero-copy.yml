name: ✅ APK UNIQUE V9.5.6 INTEGRITE — TELECHARGER ICI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v9-5-final:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MODELISEUR_DEBUG_KEYSTORE: ${{ github.workspace }}/.ci-signing/debug.keystore

    steps:
      - uses: actions/checkout@v4
        name: Récupérer le dépôt

      - uses: actions/setup-java@v4
        name: Java 17
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        name: Python 3.12
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        name: Signature stable
        with:
          path: .ci-signing/debug.keystore
          key: modeliseur-debug-keystore-v1

      - name: Préparer signature
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$MODELISEUR_DEBUG_KEYSTORE" ]; then
            mkdir -p "$(dirname "$MODELISEUR_DEBUG_KEYSTORE")"
            keytool -genkeypair -noprompt \
              -keystore "$MODELISEUR_DEBUG_KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10950
          fi

      - uses: actions/cache@v4
        name: Cache IS-Net Anime
        with:
          path: app/src/main/assets/models/isnet_anime_fp32.onnx
          key: modeliseur-v9-isnet-anime-6a92a19a

      - uses: actions/cache@v4
        name: Cache IS-Net General
        with:
          path: app/src/main/assets/models/isnet_general_use.onnx
          key: modeliseur-v9-isnet-general-fc16ebd8

      - name: Préparer IS-Net General
        shell: bash
        run: |
          set -euo pipefail
          M=app/src/main/assets/models/isnet_general_use.onnx
          mkdir -p "$(dirname "$M")"
          if [ ! -f "$M" ] || ! echo "fc16ebd8b0c10d971d3513d564d01e29  $M" | md5sum -c - >/dev/null 2>&1; then
            curl -L --fail --retry 5 -o "$M.part" https://github.com/danielgatis/rembg/releases/download/v0.0.0/isnet-general-use.onnx
            echo "fc16ebd8b0c10d971d3513d564d01e29  $M.part" | md5sum -c -
            mv "$M.part" "$M"
          fi

      - uses: actions/cache@v4
        name: Cache EfficientViT-SAM XL0
        with:
          path: |
            app/src/main/assets/models/efficientvit_sam_xl0_encoder.onnx
            app/src/main/assets/models/efficientvit_sam_xl0_decoder.onnx
          key: modeliseur-v9-efficientvit-sam-xl0-b39add8f-051bfae9

      - name: Préparer SAM XL0
        shell: bash
        run: |
          set -euo pipefail
          D=app/src/main/assets/models
          E="$D/efficientvit_sam_xl0_encoder.onnx"
          R="$D/efficientvit_sam_xl0_decoder.onnx"
          BASE="https://huggingface.co/mit-han-lab/efficientvit-sam/resolve/e4668c026bd3743c6011cc5453dbe32d4d67cadf/onnx"
          mkdir -p "$D"
          if [ ! -f "$E" ] || ! echo "b39add8f7e2f8a612af867e864d962eff5ac98c8336b32feca08327a89cc8de3  $E" | sha256sum -c - >/dev/null 2>&1; then
            curl -L --fail --retry 5 -o "$E.part" "$BASE/xl0_encoder.onnx?download=true"
            echo "b39add8f7e2f8a612af867e864d962eff5ac98c8336b32feca08327a89cc8de3  $E.part" | sha256sum -c -
            mv "$E.part" "$E"
          fi
          if [ ! -f "$R" ] || ! echo "051bfae9a07c1ff180fd7c5238334fdc45eaa0227c46f29740d98662865e01f7  $R" | sha256sum -c - >/dev/null 2>&1; then
            curl -L --fail --retry 5 -o "$R.part" "$BASE/xl0_decoder.onnx?download=true"
            echo "051bfae9a07c1ff180fd7c5238334fdc45eaa0227c46f29740d98662865e01f7  $R.part" | sha256sum -c -
            mv "$R.part" "$R"
          fi
          test "$(stat -c%s "$E")" -eq 451763082
          test "$(stat -c%s "$R")" -eq 16470368

      - uses: actions/cache@v4
        name: Cache DA3 392
        with:
          path: |
            app/src/main/assets/models/da3_small_four_view_392.onnx
            app/src/main/assets/models/da3_small_four_view_392.onnx.sha256
          key: modeliseur-v9-da3-small-four-view-392-v1

      - name: Préparer DA3 392
        run: bash tools/ci_prepare_da3_v9_392.sh

      - name: Activer V9.5.6 INTEGRITE
        shell: bash
        run: |
          set -euo pipefail
          SEG=app/src/main/java/com/chasmet/modeliseur3d/model/AnimeSegmentationEngine.java
          SAM=app/src/main/java/com/chasmet/modeliseur3d/model/EfficientVitSamSegmentationEngine.java
          DEPTH=app/src/main/java/com/chasmet/modeliseur3d/model/NeuralMultiViewDepthEngine.java
          ENGINE=app/src/main/java/com/chasmet/modeliseur3d/model/StylizedCharacter3DEngine.java
          FINAL_MESHER=app/src/main/java/com/chasmet/modeliseur3d/model/MemorySafeIndexedMesher.java
          RENDERER=app/src/main/java/com/chasmet/modeliseur3d/gl/ModelRendererV52.java
          UI=app/src/main/res/layout/activity_manual_3d.xml
          CHARACTER=app/src/main/java/com/chasmet/modeliseur3d/model/CharacterLimbIntegrityRefiner.java
          ANIMAL=app/src/main/java/com/chasmet/modeliseur3d/model/AnimalLegTopologyRefiner.java

          sed -i 's/ExtremeSegmentationEngine/RiskSegmentationEngine/g' "$SEG"

          sed -i 's/int threads = Math.max(2, Math.min(8, processors - 1));/int threads = Math.max(1, Math.min(2, processors - 1));/' "$SAM"
          sed -i 's/decoder = createCpuSession(decoderModel, Math.max(2, Math.min(6, threads)));/decoder = createCpuSession(decoderModel, 1);/' "$SAM"
          sed -i '/options.setExecutionMode(OrtSession.SessionOptions.ExecutionMode.SEQUENTIAL);/a\        options.setCPUArenaAllocator(false);\n        options.setMemoryPatternOptimization(false);' "$SAM"

          sed -i 's/int threads = Math.max(2, Math.min(8, processors - 1));/int threads = Math.max(1, Math.min(3, processors - 1));/g' "$DEPTH"
          sed -i '/options.setOptimizationLevel(OrtSession.SessionOptions.OptLevel.ALL_OPT);/a\        options.setCPUArenaAllocator(false);\n        options.setMemoryPatternOptimization(false);' "$DEPTH"
          sed -i 's/models\/da3_small_four_view_224.onnx/models\/da3_small_four_view_392.onnx/' "$DEPTH"
          sed -i 's/da3_small_four_view_224_v7_2.onnx/da3_small_four_view_392_v9.onnx/' "$DEPTH"
          sed -i 's/private static final int INPUT_SIZE = 224;/private static final int INPUT_SIZE = 392;/' "$DEPTH"
          sed -i 's/private static final int CONTENT_MARGIN = 7;/private static final int CONTENT_MARGIN = 12;/' "$DEPTH"

          sed -i 's/MultiViewDepthFusion\.refine(/RiskMultiViewDepthFusion.refine(/' "$ENGINE"
          sed -i 's/private static final int MAXIMUM_COMPONENTS = 16;/private static final int MAXIMUM_COMPONENTS = 24;/' "$ENGINE"
          sed -i 's/width = 128;/width = 160;/' "$ENGINE"
          sed -i 's/height = 256;/height = 320;/' "$ENGINE"
          sed -i 's/maximumDepth = 304;/maximumDepth = 384;/' "$ENGINE"
          sed -i 's/width = 112;/width = 144;/' "$ENGINE"
          sed -i 's/height = 224;/height = 288;/' "$ENGINE"
          sed -i 's/maximumDepth = 264;/maximumDepth = 336;/' "$ENGINE"
          sed -i 's/width = 88;/width = 112;/' "$ENGINE"
          sed -i 's/height = 176;/height = 224;/' "$ENGINE"
          sed -i 's/maximumDepth = 200;/maximumDepth = 264;/' "$ENGINE"
          sed -i 's/atlasHeight = 2048;/atlasHeight = 4096;/g' "$ENGINE"
          sed -i 's/atlasHeight = 1024;/atlasHeight = 2048;/' "$ENGINE"

          python3 tools/ci_patch_v95_memory.py

          sed -i "s/versionCode 43/versionCode 54/" app/build.gradle
          sed -i "s/versionName '7.4.0'/versionName '9.5.6'/" app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'android:label="[^"]+"', 'android:label="Modéliseur 3D V9.5.6 Intégrité"', s, count=1)
          assert n == 1
          p.write_text(s, encoding='utf-8')
          PY

          grep -q 'MemorySafeMultiViewDepthFusion.refine' app/src/main/java/com/chasmet/modeliseur3d/model/RiskMultiViewDepthFusion.java
          grep -q 'CharacterLimbIntegrityRefiner.refine' app/src/main/java/com/chasmet/modeliseur3d/model/RiskMultiViewDepthFusion.java
          grep -q 'AnimalLegTopologyRefiner.refine' app/src/main/java/com/chasmet/modeliseur3d/model/RiskMultiViewDepthFusion.java
          grep -q 'MemorySafeCompositeVehicleTopologyRefiner.refine' app/src/main/java/com/chasmet/modeliseur3d/model/RiskMultiViewDepthFusion.java
          grep -q 'aucune suppression' "$CHARACTER"
          grep -q 'aucune suppression' "$ANIMAL"
          grep -q 'finalDensity != hull.getDensity()' "$ENGINE"
          grep -q 'density\[base + z\] >= ISO' app/src/main/java/com/chasmet/modeliseur3d/model/ContinuousVisualHull.java
          ! grep -q 'boolean\[\] occupancy = new boolean\[size\]' app/src/main/java/com/chasmet/modeliseur3d/model/ContinuousVisualHull.java
          grep -q 'INPUT_SIZE = 392' "$DEPTH"
          grep -q 'width = 160' "$ENGINE"
          grep -q 'height = 320' "$ENGINE"
          grep -q 'maximumDepth = 384' "$ENGINE"
          grep -q 'MemorySafeIndexedMesher.build' "$ENGINE"
          grep -q 'Deux passes sont utilisées' "$FINAL_MESHER"
          grep -q 'V9.5.6 — intégrité personnage + animal + DA3' "$UI"
          grep -q 'android:minHeight="260dp"' "$UI"
          grep -q 'android:maxLines="2"' "$UI"
          grep -q 'updateFraming(mesh)' "$RENDERER"
          grep -q 'fitScale' "$RENDERER"
          grep -q 'Modéliseur 3D V9.5.6 Intégrité' app/src/main/AndroidManifest.xml

      - name: SDK Android 34
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          chmod +x gradlew tools/ci_v74_test.sh

      - name: Tests géométriques cheval + personnage
        run: bash tools/ci_v74_test.sh

      - name: Compiler APK V9.5.6
        run: ./gradlew --no-daemon clean lintDebug assembleDebug

      - name: Vérifier APK V9.5.6
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" | tee /tmp/v956-badging.txt
          grep -q "versionCode='54'" /tmp/v956-badging.txt
          grep -q "versionName='9.5.6'" /tmp/v956-badging.txt
          grep -q "application-label:'Modéliseur 3D V9.5.6 Intégrité'" /tmp/v956-badging.txt
          test "$(unzip -p "$APK" assets/models/efficientvit_sam_xl0_encoder.onnx | sha256sum | cut -d' ' -f1)" = "b39add8f7e2f8a612af867e864d962eff5ac98c8336b32feca08327a89cc8de3"
          test "$(unzip -p "$APK" assets/models/efficientvit_sam_xl0_decoder.onnx | sha256sum | cut -d' ' -f1)" = "051bfae9a07c1ff180fd7c5238334fdc45eaa0227c46f29740d98662865e01f7"
          DA3_SHA="$(cut -d' ' -f1 app/src/main/assets/models/da3_small_four_view_392.onnx.sha256)"
          test "$(unzip -p "$APK" assets/models/da3_small_four_view_392.onnx | sha256sum | cut -d' ' -f1)" = "$DA3_SHA"
          sha256sum "$APK" > /tmp/SHA256.txt
          stat -c '%s' "$APK" > /tmp/SIZE.txt

      - name: Préparer APK V9.5.6 unique
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v956-final
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/v956-final/Modeliseur-V9.5.6-INTEGRITE.apk
          cp /tmp/SHA256.txt /tmp/v956-final/SHA256.txt
          cp /tmp/SIZE.txt /tmp/v956-final/SIZE.txt
          ls -lh /tmp/v956-final/Modeliseur-V9.5.6-INTEGRITE.apk

      - uses: actions/upload-artifact@v4
        name: Publier UN SEUL APK V9.5.6 complet
        with:
          name: Modeliseur-V9.5.6-INTEGRITE-APK-UNIQUE
          path: |
            /tmp/v956-final/Modeliseur-V9.5.6-INTEGRITE.apk
            /tmp/v956-final/SHA256.txt
            /tmp/v956-final/SIZE.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
