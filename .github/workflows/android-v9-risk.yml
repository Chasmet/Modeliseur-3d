name: Compiler APK Android V9 Risk

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v9-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MODELISEUR_DEBUG_KEYSTORE: ${{ github.workspace }}/.ci-signing/debug.keystore

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Signature stable
        uses: actions/cache@v4
        with:
          path: .ci-signing/debug.keystore
          key: modeliseur-debug-keystore-v1

      - name: Préparer signature
        shell: bash
        run: |
          if [ ! -f "$MODELISEUR_DEBUG_KEYSTORE" ]; then
            mkdir -p "$(dirname "$MODELISEUR_DEBUG_KEYSTORE")"
            keytool -genkeypair -noprompt -keystore "$MODELISEUR_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10950
          fi

      - name: Cache IS-Net Anime
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models/isnet_anime_fp32.onnx
          key: modeliseur-v9-isnet-anime-6a92a19a

      - name: Cache IS-Net General
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models/isnet_general_use.onnx
          key: modeliseur-v9-isnet-general-fc16ebd8

      - name: Préparer IS-Net General
        shell: bash
        run: |
          set -euo pipefail
          MODEL="app/src/main/assets/models/isnet_general_use.onnx"
          PART="${MODEL}.part"
          MD5="fc16ebd8b0c10d971d3513d564d01e29"
          URL="https://github.com/danielgatis/rembg/releases/download/v0.0.0/isnet-general-use.onnx"
          mkdir -p "$(dirname "$MODEL")"
          if [ ! -f "$MODEL" ] || ! echo "$MD5  $MODEL" | md5sum -c - >/dev/null 2>&1; then
            rm -f "$MODEL" "$PART"
            curl -L --fail --retry 5 --retry-delay 2 --connect-timeout 30 -o "$PART" "$URL"
            echo "$MD5  $PART" | md5sum -c -
            mv "$PART" "$MODEL"
          fi
          test "$(stat -c%s "$MODEL")" -ge 175000000

      - name: Cache EfficientViT-SAM XL0
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/models/efficientvit_sam_xl0_encoder.onnx
            app/src/main/assets/models/efficientvit_sam_xl0_decoder.onnx
          key: modeliseur-v9-efficientvit-sam-xl0-b39add8f-051bfae9

      - name: Préparer EfficientViT-SAM XL0 1024
        shell: bash
        run: |
          set -euo pipefail
          DIR="app/src/main/assets/models"
          ENC="$DIR/efficientvit_sam_xl0_encoder.onnx"
          DEC="$DIR/efficientvit_sam_xl0_decoder.onnx"
          ENC_SHA="b39add8f7e2f8a612af867e864d962eff5ac98c8336b32feca08327a89cc8de3"
          DEC_SHA="051bfae9a07c1ff180fd7c5238334fdc45eaa0227c46f29740d98662865e01f7"
          BASE="https://huggingface.co/mit-han-lab/efficientvit-sam/resolve/e4668c026bd3743c6011cc5453dbe32d4d67cadf/onnx"
          mkdir -p "$DIR"
          if [ ! -f "$ENC" ] || ! echo "$ENC_SHA  $ENC" | sha256sum -c - >/dev/null 2>&1; then
            rm -f "$ENC" "$ENC.part"
            curl -L --fail --retry 5 --retry-delay 2 --connect-timeout 30 -o "$ENC.part" "$BASE/xl0_encoder.onnx?download=true"
            echo "$ENC_SHA  $ENC.part" | sha256sum -c -
            mv "$ENC.part" "$ENC"
          fi
          if [ ! -f "$DEC" ] || ! echo "$DEC_SHA  $DEC" | sha256sum -c - >/dev/null 2>&1; then
            rm -f "$DEC" "$DEC.part"
            curl -L --fail --retry 5 --retry-delay 2 --connect-timeout 30 -o "$DEC.part" "$BASE/xl0_decoder.onnx?download=true"
            echo "$DEC_SHA  $DEC.part" | sha256sum -c -
            mv "$DEC.part" "$DEC"
          fi
          test "$(stat -c%s "$ENC")" -eq 451763082
          test "$(stat -c%s "$DEC")" -eq 16470368

      - name: Cache DA3 V9 392
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/models/da3_small_four_view_392.onnx
            app/src/main/assets/models/da3_small_four_view_392.onnx.sha256
          key: modeliseur-v9-da3-small-four-view-392-v1

      - name: Préparer DA3 quatre vues 392
        shell: bash
        run: |
          chmod +x tools/ci_prepare_da3_v9_392.sh
          bash tools/ci_prepare_da3_v9_392.sh

      - name: Activer pipeline V9 Risk
        shell: bash
        run: |
          set -euo pipefail
          DEPTH="app/src/main/java/com/chasmet/modeliseur3d/model/NeuralMultiViewDepthEngine.java"
          SEG="app/src/main/java/com/chasmet/modeliseur3d/model/AnimeSegmentationEngine.java"
          MANIFEST="app/src/main/AndroidManifest.xml"
          LAYOUT="app/src/main/res/layout/activity_manual_3d.xml"

          sed -i 's/ExtremeSegmentationEngine/RiskSegmentationEngine/g' "$SEG"
          sed -i 's/models\/da3_small_four_view_224.onnx/models\/da3_small_four_view_392.onnx/' "$DEPTH"
          sed -i 's/da3_small_four_view_224_v7_2.onnx/da3_small_four_view_392_v9.onnx/' "$DEPTH"
          sed -i 's/private static final int INPUT_SIZE = 224;/private static final int INPUT_SIZE = 392;/' "$DEPTH"
          sed -i 's/private static final int CONTENT_MARGIN = 7;/private static final int CONTENT_MARGIN = 12;/' "$DEPTH"
          sed -i "s/versionCode 43/versionCode 47/" app/build.gradle
          sed -i "s/versionName '7.4.0'/versionName '9.0.0'/" app/build.gradle
          sed -i 's/Modéliseur 3D V8.1 General + DA3/Modéliseur 3D V9 Risk SAM XL0 + DA3 392/' "$MANIFEST"
          sed -i 's/3D locale V7.3.1 — composants suivis + DA3/3D locale V9 — SAM XL0 1024 + DA3 392/' "$LAYOUT"

          grep -q 'RiskSegmentationEngine' "$SEG"
          grep -q 'class EfficientVitSamSegmentationEngine' app/src/main/java/com/chasmet/modeliseur3d/model/EfficientVitSamSegmentationEngine.java
          grep -q 'EfficientViT-SAM-XL0 1024' app/src/main/java/com/chasmet/modeliseur3d/model/EfficientVitSamSegmentationEngine.java
          grep -q 'INPUT_SIZE = 392' "$DEPTH"
          grep -q 'da3_small_four_view_392.onnx' "$DEPTH"

      - name: SDK Android 34
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          chmod +x gradlew tools/ci_v74_test.sh

      - name: Tester géométrie V9
        run: bash tools/ci_v74_test.sh

      - name: Compiler APK V9 Risk
        run: ./gradlew --no-daemon clean lintDebug assembleDebug

      - name: Vérifier APK V9 Risk et tous les modèles
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/34.0.0"
          test -f "$APK"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging-v9.txt
          grep -q "versionCode='47'" /tmp/badging-v9.txt
          grep -q "versionName='9.0.0'" /tmp/badging-v9.txt
          test "$(unzip -p "$APK" assets/models/isnet_anime_fp32.onnx | sha256sum | cut -d' ' -f1)" = "6a92a19a47e8197fb6dbcf85be14600806019831fedfe7f86eeeeffd4c40dbba"
          test "$(unzip -p "$APK" assets/models/isnet_general_use.onnx | md5sum | cut -d' ' -f1)" = "fc16ebd8b0c10d971d3513d564d01e29"
          test "$(unzip -p "$APK" assets/models/efficientvit_sam_xl0_encoder.onnx | sha256sum | cut -d' ' -f1)" = "b39add8f7e2f8a612af867e864d962eff5ac98c8336b32feca08327a89cc8de3"
          test "$(unzip -p "$APK" assets/models/efficientvit_sam_xl0_decoder.onnx | sha256sum | cut -d' ' -f1)" = "051bfae9a07c1ff180fd7c5238334fdc45eaa0227c46f29740d98662865e01f7"
          DA3_SHA="$(cut -d' ' -f1 app/src/main/assets/models/da3_small_four_view_392.onnx.sha256)"
          test "$(unzip -p "$APK" assets/models/da3_small_four_view_392.onnx | sha256sum | cut -d' ' -f1)" = "$DA3_SHA"
          sha256sum "$APK" | tee /tmp/v9-apk.sha256
          stat -c '%s' "$APK" | tee /tmp/v9-apk.size

      - name: Découper APK en quatre parties récupérables
        shell: bash
        run: |
          mkdir -p /tmp/v9-parts
          split -n 4 -d -a 1 app/build/outputs/apk/debug/app-debug.apk /tmp/v9-parts/Modeliseur-V9-Risk.apk.part
          cp /tmp/v9-apk.sha256 /tmp/v9-parts/SHA256.txt
          cp /tmp/v9-apk.size /tmp/v9-parts/SIZE.txt
          ls -lh /tmp/v9-parts

      - name: Publier APK complet V9 Risk
        uses: actions/upload-artifact@v4
        with:
          name: Modeliseur-V9-Risk-SAM-XL0-DA3-392-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publier partie 0
        uses: actions/upload-artifact@v4
        with:
          name: Modeliseur-V9-Risk-part0
          path: /tmp/v9-parts/Modeliseur-V9-Risk.apk.part0
          compression-level: 0
          retention-days: 30

      - name: Publier partie 1
        uses: actions/upload-artifact@v4
        with:
          name: Modeliseur-V9-Risk-part1
          path: /tmp/v9-parts/Modeliseur-V9-Risk.apk.part1
          compression-level: 0
          retention-days: 30

      - name: Publier partie 2
        uses: actions/upload-artifact@v4
        with:
          name: Modeliseur-V9-Risk-part2
          path: /tmp/v9-parts/Modeliseur-V9-Risk.apk.part2
          compression-level: 0
          retention-days: 30

      - name: Publier partie 3 + contrôle
        uses: actions/upload-artifact@v4
        with:
          name: Modeliseur-V9-Risk-part3
          path: |
            /tmp/v9-parts/Modeliseur-V9-Risk.apk.part3
            /tmp/v9-parts/SHA256.txt
            /tmp/v9-parts/SIZE.txt
          compression-level: 0
          retention-days: 30
