name: "⬇️ APK FULL - TELECHARGER ICI"
run-name: "⬇️ APK V9.5.1 FULL — TÉLÉCHARGER ICI"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  full-single-apk:
    name: "⬇️ APK V9.5.1 FULL — ARTIFACT EN BAS"
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Attendre le build V9.5 Zero-Copy du même commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Commit attendu : $HEAD_SHA"
          for i in $(seq 1 120); do
            DATA=$(gh run list --repo Chasmet/Modeliseur-3d --workflow android-v9-5-zero-copy.yml --commit "$HEAD_SHA" --limit 1 --json databaseId,status,conclusion)
            RUN_ID=$(echo "$DATA" | jq -r '.[0].databaseId // empty')
            STATUS=$(echo "$DATA" | jq -r '.[0].status // empty')
            CONCLUSION=$(echo "$DATA" | jq -r '.[0].conclusion // empty')
            if [ "$STATUS" = "completed" ]; then
              test "$CONCLUSION" = "success"
              echo "SOURCE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
              echo "Build source V9.5 validé : $RUN_ID"
              exit 0
            fi
            sleep 10
          done
          echo "Build V9.5 Zero-Copy introuvable pour $HEAD_SHA" >&2
          exit 1

      - name: Reconstituer le seul APK complet
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v95full/p0 /tmp/v95full/p1 /tmp/v95full/p2 /tmp/v95full/p3 /tmp/v95full/out
          gh run download "$SOURCE_RUN_ID" --repo Chasmet/Modeliseur-3d -n Modeliseur-V9-5-ZeroCopy-part0 -D /tmp/v95full/p0
          gh run download "$SOURCE_RUN_ID" --repo Chasmet/Modeliseur-3d -n Modeliseur-V9-5-ZeroCopy-part1 -D /tmp/v95full/p1
          gh run download "$SOURCE_RUN_ID" --repo Chasmet/Modeliseur-3d -n Modeliseur-V9-5-ZeroCopy-part2 -D /tmp/v95full/p2
          gh run download "$SOURCE_RUN_ID" --repo Chasmet/Modeliseur-3d -n Modeliseur-V9-5-ZeroCopy-part3 -D /tmp/v95full/p3

          cat \
            /tmp/v95full/p0/*.part0 \
            /tmp/v95full/p1/*.part1 \
            /tmp/v95full/p2/*.part2 \
            /tmp/v95full/p3/*.part3 \
            > /tmp/v95full/out/Modeliseur-3D-V9.5.1-FULL.apk

          EXPECTED_SHA=$(awk '{print $1}' /tmp/v95full/p3/SHA256.txt)
          EXPECTED_SIZE=$(cat /tmp/v95full/p3/SIZE.txt | tr -d '[:space:]')
          ACTUAL_SHA=$(sha256sum /tmp/v95full/out/Modeliseur-3D-V9.5.1-FULL.apk | awk '{print $1}')
          ACTUAL_SIZE=$(stat -c%s /tmp/v95full/out/Modeliseur-3D-V9.5.1-FULL.apk)

          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$ACTUAL_SIZE" = "$EXPECTED_SIZE"
          unzip -t /tmp/v95full/out/Modeliseur-3D-V9.5.1-FULL.apk >/dev/null

          echo "$ACTUAL_SHA  Modeliseur-3D-V9.5.1-FULL.apk" > /tmp/v95full/out/SHA256.txt
          echo "$ACTUAL_SIZE" > /tmp/v95full/out/SIZE.txt
          echo "APK complet vérifié : $ACTUAL_SIZE octets"

      - name: "⬇️ PUBLIER APK DIRECTEMENT DANS ACTIONS"
        uses: actions/upload-artifact@v4
        with:
          name: TELECHARGER-APK-V9.5.1-FULL
          path: /tmp/v95full/out/Modeliseur-3D-V9.5.1-FULL.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publier aussi une Release de secours
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete v9.5-full --repo Chasmet/Modeliseur-3d --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create v9.5-full \
            /tmp/v95full/out/Modeliseur-3D-V9.5.1-FULL.apk \
            /tmp/v95full/out/SHA256.txt \
            /tmp/v95full/out/SIZE.txt \
            --repo Chasmet/Modeliseur-3d \
            --target "$HEAD_SHA" \
            --title "Modeliseur 3D V9.5.1 FULL" \
            --notes "APK complet V9.5.1. Le téléchargement principal est dans GitHub Actions, Artifact TELECHARGER-APK-V9.5.1-FULL." \
            --prerelease

      - name: Afficher où télécharger dans Actions
        shell: bash
        run: |
          SIZE=$(cat /tmp/v95full/out/SIZE.txt | tr -d '[:space:]')
          SHA=$(awk '{print $1}' /tmp/v95full/out/SHA256.txt)
          {
            echo "# ⬇️ APK V9.5.1 FULL PRÊT"
            echo
            echo "## Descends tout en bas de CETTE page GitHub Actions"
            echo
            echo "### Dans **Artifacts**, appuie sur :"
            echo
            echo "# TELECHARGER-APK-V9.5.1-FULL"
            echo
            echo "APK complet : ${SIZE} octets"
            echo
            echo "SHA-256 : \`${SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
