name: Vérifier renforcement TripoSR V6.6.3

on:
  push:
    branches:
      - agent/tripo-local-boost-v6.6.3
      - agent/trellis-third-tab-auto-update
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-java-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          chmod +x gradlew
      - name: Test local de l’APK sans téléchargement des poids
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -PtripoSourceCheckOnly -PofflineSmoke             :app:testDebugUnitTest --tests 'com.chasmet.modeliseur3d.model.TripoInputDetailBoostAndroidTest'             --tests 'com.chasmet.modeliseur3d.model.TripoFaceLocatorTest'
      - name: Rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tripo-boost-v663-source-validation
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
