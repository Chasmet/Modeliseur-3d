name: V7.3 Feature Mesh Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feature-mesh:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Tester le lissage sensible aux formes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/feature-mesh-tests
          javac -encoding UTF-8 -d build/feature-mesh-tests \
            app/src/main/java/com/chasmet/modeliseur3d/model/MeshData.java \
            app/src/main/java/com/chasmet/modeliseur3d/model/SubjectCategory.java \
            app/src/main/java/com/chasmet/modeliseur3d/model/FeatureAwareMeshOptimizer.java \
            app/src/main/java/com/chasmet/modeliseur3d/model/MeshSurfaceOptimizer.java \
            validation/java/com/chasmet/modeliseur3d/model/FeatureAwareMeshOptimizerSelfTest.java
          java -cp build/feature-mesh-tests \
            com.chasmet.modeliseur3d.model.FeatureAwareMeshOptimizerSelfTest
