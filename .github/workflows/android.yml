name: Compiler l'APK Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Mettre en cache le modèle neuronal
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models/depth_anything_v2_small_fp32.onnx
          key: depth-anything-v2-small-fp32-afb6a5c28f3b6bf1

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Android 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Autoriser le script Gradle
        run: chmod +x gradlew

      - name: Compiler et vérifier la V4 neuronale
        run: ./gradlew --no-daemon clean lintDebug assembleDebug

      - name: Vérifier la taille de l'APK
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK V4
        uses: actions/upload-artifact@v4
        with:
          name: Modeliseur3D-V4-Neural-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
