name: Compiler l'APK Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Mettre en cache les réseaux V4.1.1
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/models/depth_anything_v2_small_fp32.onnx
            app/src/main/assets/models/isnet_anime_int8.onnx
          key: modeliseur-v411-depth-afb6a5c2-isnet-int8-a6832786

      - name: Télécharger et vérifier IS-Net Anime INT8
        shell: bash
        run: |
          set -euo pipefail
          MODEL="app/src/main/assets/models/isnet_anime_int8.onnx"
          PART="${MODEL}.part"
          SHA="a6832786351b9a1283bb1cd4a2b9a77f1fe0330ad5e7324a6c4603db478b034e"
          URL="https://huggingface.co/onnx-community/anime-seg-ONNX/resolve/25f233dc9f60e116dc79a5ba7e9575585388a36f/onnx/model_int8.onnx?download=true"
          mkdir -p "$(dirname "$MODEL")"
          if [ -f "$MODEL" ] && echo "$SHA  $MODEL" | sha256sum -c - >/dev/null 2>&1; then
            echo "IS-Net Anime INT8 déjà présent dans le cache et vérifié."
          else
            rm -f "$MODEL" "$PART"
            curl -L --fail --retry 5 --retry-delay 2 --connect-timeout 30 \
              -o "$PART" "$URL"
            echo "$SHA  $PART" | sha256sum -c -
            mv "$PART" "$MODEL"
          fi

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Android 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Autoriser le script Gradle
        run: chmod +x gradlew

      - name: Compiler et vérifier la V4.1.1 neuronale
        run: ./gradlew --no-daemon clean lintDebug assembleDebug

      - name: Vérifier la taille et le SHA-256 de l'APK
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK V4.1.1
        uses: actions/upload-artifact@v4
        with:
          name: Modeliseur3D-V4.1.1-Neural-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
