name: Compiler l'APK Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Mettre en cache les réseaux locaux V4.3
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/models/depth_anything_v2_small_fp32.onnx
            app/src/main/assets/models/isnet_anime_fp32.onnx
          key: modeliseur-v42-depth-afb6a5c2-isnet-fp32-6a92a19a

      - name: Télécharger et vérifier IS-Net Anime FP32
        shell: bash
        run: |
          set -euo pipefail
          MODEL="app/src/main/assets/models/isnet_anime_fp32.onnx"
          PART="${MODEL}.part"
          SHA="6a92a19a47e8197fb6dbcf85be14600806019831fedfe7f86eeeeffd4c40dbba"
          URL="https://huggingface.co/onnx-community/anime-seg-ONNX/resolve/25f233dc9f60e116dc79a5ba7e9575585388a36f/onnx/model.onnx?download=true"
          mkdir -p "$(dirname "$MODEL")"
          if [ -f "$MODEL" ] && echo "$SHA  $MODEL" | sha256sum -c - >/dev/null 2>&1; then
            echo "IS-Net Anime FP32 déjà présent dans le cache et vérifié."
          else
            rm -f "$MODEL" "$PART"
            curl -L --fail --retry 5 --retry-delay 2 --connect-timeout 30 \
              -o "$PART" "$URL"
            echo "$SHA  $PART" | sha256sum -c -
            mv "$PART" "$MODEL"
          fi

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Android 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Autoriser le script Gradle
        run: chmod +x gradlew

      - name: Tester le regroupement des silhouettes
        run: |
          mkdir -p build/view-grouping-tests
          javac -encoding UTF-8 \
            -d build/view-grouping-tests \
            app/src/main/java/com/chasmet/modeliseur3d/model/ViewCandidateGrouper.java \
            validation/java/com/chasmet/modeliseur3d/model/ViewCandidateGrouperSelfTest.java
          java -cp build/view-grouping-tests \
            com.chasmet.modeliseur3d.model.ViewCandidateGrouperSelfTest

      - name: Tester la cible GLB mobile 200 Ko
        run: |
          mkdir -p build/mobile-plan-tests
          javac -encoding UTF-8 \
            -d build/mobile-plan-tests \
            app/src/main/java/com/chasmet/modeliseur3d/cloud/MobileOptimizationPlan.java \
            validation/java/com/chasmet/modeliseur3d/cloud/MobileOptimizationPlanSelfTest.java
          java -cp build/mobile-plan-tests \
            com.chasmet.modeliseur3d.cloud.MobileOptimizationPlanSelfTest

      - name: Tester l'association des vues vidéo
        run: |
          mkdir -p build/video-view-tests
          javac -encoding UTF-8 \
            -d build/video-view-tests \
            app/src/main/java/com/chasmet/modeliseur3d/media/VideoViewPlan.java \
            validation/java/com/chasmet/modeliseur3d/media/VideoViewPlanSelfTest.java
          java -cp build/video-view-tests \
            com.chasmet.modeliseur3d.media.VideoViewPlanSelfTest

      - name: Compiler et vérifier la V4.3 hybride
        run: ./gradlew --no-daemon clean lintDebug assembleDebug

      - name: Vérifier la taille et le SHA-256 de l'APK
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK V4.3
        uses: actions/upload-artifact@v4
        with:
          name: Modeliseur3D-V4.3-Video-Cloud-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
