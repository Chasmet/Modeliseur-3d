name: Compiler l'APK Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Android 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Autoriser le script Gradle
        run: chmod +x gradlew

      - name: Compiler et vérifier
        run: ./gradlew --no-daemon clean lintDebug assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Modeliseur3D-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
