name: Compiler APK Android V7.4

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODELISEUR_DEBUG_KEYSTORE: ${{ github.workspace }}/.ci-signing/debug.keystore

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Signature stable
        uses: actions/cache@v4
        with:
          path: .ci-signing/debug.keystore
          key: modeliseur-debug-keystore-v1

      - name: Préparer signature
        shell: bash
        run: |
          if [ ! -f "$MODELISEUR_DEBUG_KEYSTORE" ]; then
            mkdir -p "$(dirname "$MODELISEUR_DEBUG_KEYSTORE")"
            keytool -genkeypair -noprompt -keystore "$MODELISEUR_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10950
          fi

      - name: Cache IS-Net
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models/isnet_anime_fp32.onnx
          key: modeliseur-v730-da3-isnet-fp32-6a92a19a

      - name: Cache DA3
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models/da3_small_four_view_224.onnx
          key: modeliseur-v730-da3-small-e08cab65-exporter-9d75a052-normalized-b83acb5b

      - name: Préparer DA3
        run: bash tools/ci_prepare_da3.sh

      - name: SDK Android 34 et identité V7.4
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          chmod +x gradlew tools/ci_v74_test.sh
          sed -i 's/3D locale V7.3.1 — composants suivis + DA3/3D locale V7.4 — correspondance 3D + DA3/' app/src/main/res/layout/activity_manual_3d.xml

      - name: Tester correspondance 3D V7.4
        run: bash tools/ci_v74_test.sh

      - name: Compiler APK
        run: ./gradlew --no-daemon clean lintDebug assembleDebug

      - name: Vérifier APK V7.4
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/34.0.0"
          test -f "$APK"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='43'" /tmp/badging.txt
          grep -q "versionName='7.4.0'" /tmp/badging.txt
          test "$(unzip -p "$APK" assets/models/isnet_anime_fp32.onnx | sha256sum | cut -d' ' -f1)" = "6a92a19a47e8197fb6dbcf85be14600806019831fedfe7f86eeeeffd4c40dbba"
          test "$(unzip -p "$APK" assets/models/da3_small_four_view_224.onnx | sha256sum | cut -d' ' -f1)" = "b83acb5bcfa05e1393396fab77e31605b6f2ba53c8f04c2a0644c46557acefb6"
          strings "$APK" | grep -q 'V7.4' || true

      - name: Publier APK V7.4
        uses: actions/upload-artifact@v4
        with:
          name: Modeliseur-V7-4-Correspondance-3D-DA3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
