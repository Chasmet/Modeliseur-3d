name: Compiler l'APK Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODELISEUR_DEBUG_KEYSTORE: ${{ github.workspace }}/.ci-signing/debug.keystore

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Conserver la signature APK de test
        uses: actions/cache@v4
        with:
          path: .ci-signing/debug.keystore
          key: modeliseur-debug-keystore-v1

      - name: Préparer la signature APK de test
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$MODELISEUR_DEBUG_KEYSTORE" ]; then
            mkdir -p "$(dirname "$MODELISEUR_DEBUG_KEYSTORE")"
            keytool -genkeypair -noprompt \
              -keystore "$MODELISEUR_DEBUG_KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10950
          fi

      - name: Mettre en cache le détourage local V5.1
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models/isnet_anime_fp32.onnx
          key: modeliseur-v51-face-dos-isnet-fp32-6a92a19a

      - name: Télécharger et vérifier IS-Net Anime FP32
        shell: bash
        run: |
          set -euo pipefail
          MODEL="app/src/main/assets/models/isnet_anime_fp32.onnx"
          PART="${MODEL}.part"
          SHA="6a92a19a47e8197fb6dbcf85be14600806019831fedfe7f86eeeeffd4c40dbba"
          URL="https://huggingface.co/onnx-community/anime-seg-ONNX/resolve/25f233dc9f60e116dc79a5ba7e9575585388a36f/onnx/model.onnx?download=true"
          mkdir -p "$(dirname "$MODEL")"
          if [ -f "$MODEL" ] && echo "$SHA  $MODEL" | sha256sum -c - >/dev/null 2>&1; then
            echo "IS-Net Anime FP32 déjà présent et vérifié."
          else
            rm -f "$MODEL" "$PART"
            curl -L --fail --retry 5 --retry-delay 2 --connect-timeout 30 \
              -o "$PART" "$URL"
            echo "$SHA  $PART" | sha256sum -c -
            mv "$PART" "$MODEL"
          fi

      - name: Préparer le SDK Android
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0"

      - name: Autoriser le script Gradle
        run: chmod +x gradlew

      - name: Vérifier l'architecture V5.1 Face Dos
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml
          grep -q "android.permission.WAKE_LOCK" app/src/main/AndroidManifest.xml
          grep -q "versionName '5.1.0'" app/build.gradle
          grep -q "versionCode 17" app/build.gradle
          ! grep -q "downloadDepthModel" app/build.gradle
          grep -q "REQUEST_BACK_IMAGE" \
            app/src/main/java/com/chasmet/modeliseur3d/MainActivity.java
          grep -q "composeFrontBackAtlas" \
            app/src/main/java/com/chasmet/modeliseur3d/MainActivity.java
          grep -q "selectFrontButton" \
            app/src/main/res/layout/activity_main.xml
          grep -q "selectBackButton" \
            app/src/main/res/layout/activity_main.xml
          grep -q "rotationButton" \
            app/src/main/res/layout/activity_main.xml
          grep -q "toggleAutoRotation" \
            app/src/main/java/com/chasmet/modeliseur3d/gl/ModelGLSurfaceView.java
          grep -q "AUTO_ROTATION_DEGREES_PER_SECOND" \
            app/src/main/java/com/chasmet/modeliseur3d/gl/ModelRenderer.java
          grep -q "angleY - deltaX" \
            app/src/main/java/com/chasmet/modeliseur3d/gl/ModelRenderer.java
          grep -q "wrapDegrees" \
            app/src/main/java/com/chasmet/modeliseur3d/gl/ModelRenderer.java
          grep -q "texel.a < 0.055" \
            app/src/main/java/com/chasmet/modeliseur3d/gl/ModelRenderer.java
          grep -q "image/png" \
            app/src/main/java/com/chasmet/modeliseur3d/model/MobileGlbExporter.java
          grep -q "MAXIMUM_MOBILE_GLB_BYTES = 1_000_000L" \
            app/src/main/java/com/chasmet/modeliseur3d/model/ObjExporter.java

      - name: Tester la sélection du personnage principal
        run: |
          mkdir -p build/single-subject-tests
          javac -encoding UTF-8 \
            -d build/single-subject-tests \
            app/src/main/java/com/chasmet/modeliseur3d/model/SingleSubjectSelector.java \
            validation/java/com/chasmet/modeliseur3d/model/SingleSubjectSelectorSelfTest.java
          java -cp build/single-subject-tests \
            com.chasmet.modeliseur3d.model.SingleSubjectSelectorSelfTest

      - name: Tester le maillage fermé 2.5D
        run: |
          mkdir -p build/relief-25d-tests
          javac -encoding UTF-8 \
            -d build/relief-25d-tests \
            app/src/main/java/com/chasmet/modeliseur3d/model/MeshData.java \
            app/src/main/java/com/chasmet/modeliseur3d/model/Relief25DMesher.java \
            validation/java/com/chasmet/modeliseur3d/model/Relief25DMesherSelfTest.java
          java -cp build/relief-25d-tests \
            com.chasmet.modeliseur3d.model.Relief25DMesherSelfTest

      - name: Tester la simplification mobile
        run: |
          mkdir -p build/mobile-mesh-tests
          javac -encoding UTF-8 \
            -d build/mobile-mesh-tests \
            app/src/main/java/com/chasmet/modeliseur3d/model/MeshData.java \
            app/src/main/java/com/chasmet/modeliseur3d/model/MobileMeshOptimizer.java \
            validation/java/com/chasmet/modeliseur3d/model/MobileMeshOptimizerSelfTest.java
          java -cp build/mobile-mesh-tests \
            com.chasmet.modeliseur3d.model.MobileMeshOptimizerSelfTest

      - name: Compiler et vérifier la V5.1 Face Dos
        run: |
          ./gradlew --no-daemon clean lintDebug assembleDebug || {
            find app/build/reports -name 'lint-results-debug.txt' \
              -print -exec cat {} \; 2>/dev/null || true
            exit 1
          }

      - name: Vérifier l'APK, sa signature et son modèle
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          ISNET_SHA="6a92a19a47e8197fb6dbcf85be14600806019831fedfe7f86eeeeffd4c40dbba"

          ls -lh "$APK"
          sha256sum "$APK"
          test -f "$MODELISEUR_DEBUG_KEYSTORE"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | sed -n '1,3p'
          test "$(unzip -p "$APK" assets/models/isnet_anime_fp32.onnx | sha256sum | cut -d' ' -f1)" = "$ISNET_SHA"
          ! unzip -l "$APK" | grep -q "depth_anything"

      - name: Publier l'APK V5.1 Face Dos
        uses: actions/upload-artifact@v4
        with:
          name: Modeliseur-2.5D-V5.1-Face-Dos-Rotation-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
