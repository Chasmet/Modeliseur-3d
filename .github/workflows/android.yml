name: Compiler l'APK Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODELISEUR_DEBUG_KEYSTORE: ${{ github.workspace }}/.ci-signing/debug.keystore

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Conserver la signature APK de test
        uses: actions/cache@v4
        with:
          path: .ci-signing/debug.keystore
          key: modeliseur-debug-keystore-v1

      - name: Préparer la signature APK de test
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$MODELISEUR_DEBUG_KEYSTORE" ]; then
            mkdir -p "$(dirname "$MODELISEUR_DEBUG_KEYSTORE")"
            keytool -genkeypair -noprompt \
              -keystore "$MODELISEUR_DEBUG_KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10950
          fi

      - name: Mettre en cache les réseaux V4.2
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/models/depth_anything_v2_small_fp32.onnx
            app/src/main/assets/models/isnet_anime_fp32.onnx
          key: modeliseur-v42-depth-afb6a5c2-isnet-fp32-6a92a19a

      - name: Télécharger et vérifier IS-Net Anime FP32
        shell: bash
        run: |
          set -euo pipefail
          MODEL="app/src/main/assets/models/isnet_anime_fp32.onnx"
          PART="${MODEL}.part"
          SHA="6a92a19a47e8197fb6dbcf85be14600806019831fedfe7f86eeeeffd4c40dbba"
          URL="https://huggingface.co/onnx-community/anime-seg-ONNX/resolve/25f233dc9f60e116dc79a5ba7e9575585388a36f/onnx/model.onnx?download=true"
          mkdir -p "$(dirname "$MODEL")"
          if [ -f "$MODEL" ] && echo "$SHA  $MODEL" | sha256sum -c - >/dev/null 2>&1; then
            echo "IS-Net Anime FP32 déjà présent dans le cache et vérifié."
          else
            rm -f "$MODEL" "$PART"
            curl -L --fail --retry 5 --retry-delay 2 --connect-timeout 30 \
              -o "$PART" "$URL"
            echo "$SHA  $PART" | sha256sum -c -
            mv "$PART" "$MODEL"
          fi

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Android 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Autoriser le script Gradle
        run: chmod +x gradlew

      - name: Tester le regroupement des silhouettes
        run: |
          mkdir -p build/view-grouping-tests
          javac -encoding UTF-8 \
            -d build/view-grouping-tests \
            app/src/main/java/com/chasmet/modeliseur3d/model/ViewCandidateGrouper.java \
            validation/java/com/chasmet/modeliseur3d/model/ViewCandidateGrouperSelfTest.java
          java -cp build/view-grouping-tests \
            com.chasmet.modeliseur3d.model.ViewCandidateGrouperSelfTest

      - name: Compiler et vérifier la V4.2 neuronale
        run: ./gradlew --no-daemon clean lintDebug assembleDebug

      - name: Vérifier l'APK, sa signature et ses modèles
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          DEPTH_SHA="afb6a5c28f3b6bf1618c6e43f02073ef9dfdc70e937502d51603e57b0a1df10c"
          ISNET_SHA="6a92a19a47e8197fb6dbcf85be14600806019831fedfe7f86eeeeffd4c40dbba"

          ls -lh "$APK"
          sha256sum "$APK"
          test -f "$MODELISEUR_DEBUG_KEYSTORE"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | sed -n '1,3p'

          test "$(unzip -p "$APK" assets/models/depth_anything_v2_small_fp32.onnx | sha256sum | cut -d' ' -f1)" = "$DEPTH_SHA"
          test "$(unzip -p "$APK" assets/models/isnet_anime_fp32.onnx | sha256sum | cut -d' ' -f1)" = "$ISNET_SHA"

      - name: Publier l'APK V4.2
        uses: actions/upload-artifact@v4
        with:
          name: Modeliseur3D-V4.2-Neural-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
