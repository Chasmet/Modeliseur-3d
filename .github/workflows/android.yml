name: Compiler l'APK Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODELISEUR_DEBUG_KEYSTORE: ${{ github.workspace }}/.ci-signing/debug.keystore

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Conserver la signature APK de test
        uses: actions/cache@v4
        with:
          path: .ci-signing/debug.keystore
          key: modeliseur-debug-keystore-v1

      - name: Préparer la signature APK de test
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$MODELISEUR_DEBUG_KEYSTORE" ]; then
            mkdir -p "$(dirname "$MODELISEUR_DEBUG_KEYSTORE")"
            keytool -genkeypair -noprompt \
              -keystore "$MODELISEUR_DEBUG_KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10950
          fi

      - name: Mettre en cache le détourage local V5.9.1
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models/isnet_anime_fp32.onnx
          key: modeliseur-v591-fast-glb-isnet-fp32-6a92a19a

      - name: Télécharger et vérifier IS-Net Anime FP32
        shell: bash
        run: |
          set -euo pipefail
          MODEL="app/src/main/assets/models/isnet_anime_fp32.onnx"
          PART="${MODEL}.part"
          SHA="6a92a19a47e8197fb6dbcf85be14600806019831fedfe7f86eeeeffd4c40dbba"
          URL="https://huggingface.co/onnx-community/anime-seg-ONNX/resolve/25f233dc9f60e116dc79a5ba7e9575585388a36f/onnx/model.onnx?download=true"
          mkdir -p "$(dirname "$MODEL")"
          if [ -f "$MODEL" ] && echo "$SHA  $MODEL" | sha256sum -c - >/dev/null 2>&1; then
            echo "IS-Net Anime FP32 déjà présent et vérifié."
          else
            rm -f "$MODEL" "$PART"
            curl -L --fail --retry 5 --retry-delay 2 --connect-timeout 30 -o "$PART" "$URL"
            echo "$SHA  $PART" | sha256sum -c -
            mv "$PART" "$MODEL"
          fi

      - name: Préparer le SDK Android
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Autoriser Gradle
        run: chmod +x gradlew

      - name: Vérifier l'architecture V5.9.1 export rapide
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml
          grep -q "Modéliseur 3D V5.9.1" app/src/main/AndroidManifest.xml
          grep -q "versionName '5.9.1'" app/build.gradle
          grep -q "versionCode 27" app/build.gradle
          grep -q "Fast3DGlbExporter" app/src/main/java/com/chasmet/modeliseur3d/Manual3DActivity.java
          grep -q "startExportPreparation" app/src/main/java/com/chasmet/modeliseur3d/Manual3DActivity.java
          grep -q "FastMobileMeshOptimizer.simplify" app/src/main/java/com/chasmet/modeliseur3d/model/Fast3DGlbExporter.java
          grep -q "SEARCH_PASSES = 8" app/src/main/java/com/chasmet/modeliseur3d/model/FastMobileMeshOptimizer.java
          ! grep -q "ObjExporter.export" app/src/main/java/com/chasmet/modeliseur3d/Manual3DActivity.java
          grep -q "préparé automatiquement pendant la prévisualisation" app/src/main/res/layout/activity_manual_3d.xml
          grep -q "FaceBack25DEngine" app/src/main/java/com/chasmet/modeliseur3d/MainActivityV52.java
          grep -q "MAXIMUM_MOBILE_GLB_BYTES = 200_000L" app/src/main/java/com/chasmet/modeliseur3d/model/ObjExporter.java
          grep -q "MAXIMUM_GLB_BYTES = 200_000L" app/src/main/java/com/chasmet/modeliseur3d/model/Fast3DGlbExporter.java

      - name: Tester l'orientation verticale V5.9
        shell: bash
        run: |
          mkdir -p build/orientation-tests
          javac -encoding UTF-8 -d build/orientation-tests \
            app/src/main/java/com/chasmet/modeliseur3d/model/MeshData.java \
            app/src/main/java/com/chasmet/modeliseur3d/model/MeshOrientationCorrector.java \
            validation/java/com/chasmet/modeliseur3d/model/MeshOrientationCorrectorSelfTest.java
          java -cp build/orientation-tests \
            com.chasmet.modeliseur3d.model.MeshOrientationCorrectorSelfTest

      - name: Tester le moteur volumique V5.9
        shell: bash
        run: |
          mkdir -p build/stylized-3d-tests
          javac -encoding UTF-8 -d build/stylized-3d-tests \
            app/src/main/java/com/chasmet/modeliseur3d/model/FourViewAutoCorrector.java \
            app/src/main/java/com/chasmet/modeliseur3d/model/StylizedFourViewProjector.java \
            validation/java/com/chasmet/modeliseur3d/model/StylizedCharacter3DSelfTest.java
          java -cp build/stylized-3d-tests \
            com.chasmet.modeliseur3d.model.StylizedCharacter3DSelfTest

      - name: Tester la simplification GLB rapide V5.9.1
        shell: bash
        run: |
          mkdir -p build/fast-mobile-tests
          javac -encoding UTF-8 -d build/fast-mobile-tests \
            app/src/main/java/com/chasmet/modeliseur3d/model/MeshData.java \
            app/src/main/java/com/chasmet/modeliseur3d/model/FastMobileMeshOptimizer.java \
            validation/java/com/chasmet/modeliseur3d/model/FastMobileMeshOptimizerSelfTest.java
          java -cp build/fast-mobile-tests \
            com.chasmet.modeliseur3d.model.FastMobileMeshOptimizerSelfTest

      - name: Tester les composants Java existants
        shell: bash
        run: |
          mkdir -p build/manual-view-plan-tests build/mobile-mesh-tests build/face-back-tests
          javac -encoding UTF-8 -d build/manual-view-plan-tests \
            app/src/main/java/com/chasmet/modeliseur3d/ManualViewPlan.java \
            validation/java/com/chasmet/modeliseur3d/ManualViewPlanSelfTest.java
          java -cp build/manual-view-plan-tests com.chasmet.modeliseur3d.ManualViewPlanSelfTest
          javac -encoding UTF-8 -d build/mobile-mesh-tests \
            app/src/main/java/com/chasmet/modeliseur3d/model/MeshData.java \
            app/src/main/java/com/chasmet/modeliseur3d/model/MobileMeshOptimizer.java \
            validation/java/com/chasmet/modeliseur3d/model/MobileMeshOptimizerSelfTest.java
          java -cp build/mobile-mesh-tests com.chasmet.modeliseur3d.model.MobileMeshOptimizerSelfTest
          javac -encoding UTF-8 -d build/face-back-tests \
            app/src/main/java/com/chasmet/modeliseur3d/model/MeshData.java \
            app/src/main/java/com/chasmet/modeliseur3d/model/FaceBack25DMesher.java \
            validation/java/com/chasmet/modeliseur3d/model/FaceBack25DMesherSelfTest.java
          java -cp build/face-back-tests com.chasmet.modeliseur3d.model.FaceBack25DMesherSelfTest

      - name: Compiler et vérifier la V5.9.1
        run: |
          ./gradlew --no-daemon clean lintDebug assembleDebug || {
            find app/build/reports -name 'lint-results-debug.txt' -print -exec cat {} \; 2>/dev/null || true
            exit 1
          }

      - name: Vérifier l'APK et sa signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          ISNET_SHA="6a92a19a47e8197fb6dbcf85be14600806019831fedfe7f86eeeeffd4c40dbba"
          ls -lh "$APK"
          sha256sum "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | sed -n '1,3p'
          test "$(unzip -p "$APK" assets/models/isnet_anime_fp32.onnx | sha256sum | cut -d' ' -f1)" = "$ISNET_SHA"

      - name: Publier l'APK V5.9.1
        uses: actions/upload-artifact@v4
        with:
          name: Modeliseur-V5.9.1-3D-Export-GLB-Rapide-200ko-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
