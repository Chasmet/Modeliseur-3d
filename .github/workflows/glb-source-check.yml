name: Vérification rapide du lecteur GLB

on:
  push:
    branches: ['feature/lecteur-glb-v667']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer la version
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Préparer Android 34
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          chmod +x gradlew
      - name: Compiler les sources Java sans modèles lourds
        run: ./gradlew --no-daemon :app:compileDebugJavaWithJavac -PtripoSourceCheckOnly
      - name: Tests unitaires de base sans modèles lourds
        run: ./gradlew --no-daemon :app:testDebugUnitTest -PtripoSourceCheckOnly
