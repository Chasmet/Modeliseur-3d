name: Vérifier réparation Tripo Fusion 360

on:
  push:
    branches: [agent/tripo-fusion360-geometry-repair-v6.6.6]
    paths: ['app/**', 'tools/android-smoke/**', '.github/workflows/fusion360-geometry-repair.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Préparer le SDK Android 34
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          chmod +x gradlew
      - name: Vérifier le moteur de fusion et les jambes préservées
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -PtripoSourceCheckOnly -PofflineSmoke \
            :app:compileDebugJavaWithJavac :app:testDebugUnitTest \
            --tests 'com.chasmet.modeliseur3d.TripoFusion360AndroidTest'
      - name: Rapports des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-360-geometry-repair-tests
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
